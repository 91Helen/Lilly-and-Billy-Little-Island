<!doctype html>
<html>
    <head>
        <meta charset=utf8>
        <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
        <style>
            :root {
                color-scheme: light;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top,0px);
                padding-bottom: env(safe-area-inset-bottom,0px)
            }

            html {
                scroll-padding-top: env(safe-area-inset-top,0px)
            }

            body {
                margin: 0;
                padding: 0;
                font: 14px -apple-system,BlinkMacSystemFont,sans-serif;
                background: #fff;
                color: #000
            }

            img {
                max-width: 100%
            }

            [hidden]:not([hidden=until-found i]) {
                display: none!important
            }
        </style>
    </head>
    <body>
        <title>Billy & Lilly Playground</title>
        <meta name="claude:viewport-fit-sides" content="cover">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
        <style>
            /* Layout: top bar, full-width playground scene, bottom dock with a picture cue, big buttons and progress dots. Single bright look by choice. */
            :root {
                --sky: #7cc8f5;
                --grass: #6fc243;
                --sun: #ffd23f;
                --coral: #ff6b6b;
                --teal: #1fb5a8;
                --grape: #8e5bd9;
                --ink: #2b2350;
                --paper: #ffffff;
                --display: 'Baloo 2','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
            }

            * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent
            }

            html,body {
                height: 100%
            }

            body {
                margin: 0;
                background: var(--sky);
                color: var(--ink);
                font-family: var(--display);
                font-weight: 600;
                overflow: hidden;
                user-select: none;
                -webkit-user-select: none;
                padding-left: max(16px,env(safe-area-inset-left,0px));
                padding-right: max(16px,env(safe-area-inset-right,0px));
            }

            #app {
                height: 100%;
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding-block:8px;min-height: 0
            }

            button {
                font: inherit;
                color: inherit;
                cursor: pointer;
                border: 0;
                background: none;
                touch-action: manipulation
            }

            button:focus-visible {
                outline: 4px solid var(--ink);
                outline-offset: 3px
            }

            #bar {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: space-between
            }

            #levels {
                display: flex;
                gap: 6px
            }

            .pill {
                background: var(--paper);
                border-radius: 999px;
                box-shadow: 0 3px 0 rgba(43,35,80,.25);
                display: flex;
                align-items: center;
                justify-content: center
            }

            .ib {
                width: 44px;
                height: 44px;
                font-size: 22px;
                line-height: 1
            }

            .lv {
                width: 44px;
                height: 44px;
                font-size: 20px;
                position: relative;
                flex: 0 0 auto
            }

            .lv b {
                position: absolute;
                right: -2px;
                bottom: -4px;
                background: var(--ink);
                color: #fff;
                border-radius: 50%;
                width: 18px;
                height: 18px;
                font-size: 12px;
                line-height: 18px;
                text-align: center
            }

            .lv.on {
                background: var(--sun);
                transform: translateY(-2px)
            }

            .ib.off {
                opacity: .55;
                background: #e3e6f0
            }

            .ib.off::after {
                content: "";
                position: absolute;
                width: 30px;
                height: 4px;
                background: var(--coral);
                border-radius: 3px;
                transform: rotate(-45deg)
            }

            .ib {
                position: relative
            }

            #stars {
                padding: 0 14px;
                height: 44px;
                font-size: 22px;
                gap: 6px
            }

            #stage {
                position: relative;
                flex: 1;
                min-height: 220px;
                border-radius: 24px;
                overflow: hidden;
                background: var(--sky);
                box-shadow: 0 5px 0 rgba(43,35,80,.25)
            }

            #scene {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                overflow: visible;
                touch-action: manipulation
            }

            #fx,#draw {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                pointer-events: none
            }

            #draw.on {
                pointer-events: auto;
                touch-action: none;
                cursor: crosshair
            }

            #bubbles {
                position: absolute;
                inset: 0;
                pointer-events: none
            }

            .bubble {
                position: absolute;
                background: #fff;
                border: 4px solid var(--ink);
                border-radius: 20px;
                padding: 4px 14px;
                font-size: clamp(16px,3.4vw,24px);
                font-weight: 800;
                white-space: nowrap;
                box-shadow: 0 4px 0 rgba(43,35,80,.2)
            }

            #bignum {
                position: absolute;
                left: 50%;
                top: 38%;
                transform: translate(-50%,-50%);
                font-size: clamp(90px,22vw,200px);
                font-weight: 800;
                color: #fff;
                -webkit-text-stroke: 8px var(--ink);
                paint-order: stroke fill;
                pointer-events: none;
                line-height: 1
            }

            #menu {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: center;
                padding: 12px 12px 10px;
                pointer-events: none;
                text-align: center;
                background: linear-gradient(rgba(124,200,245,.0),rgba(124,200,245,0))
            }

            #menu>* {
                pointer-events: auto
            }

            #menu h1 {
                margin: 0;
                font-size: clamp(40px,9vw,84px);
                font-weight: 800;
                line-height: 1;
                color: #fff;
                -webkit-text-stroke: 7px var(--ink);
                paint-order: stroke fill;
                letter-spacing: 1px
            }

            #menu .sub {
                margin: 2px 0 0;
                font-size: clamp(18px,3.4vw,28px);
                color: var(--ink);
                font-weight: 800;
                background: var(--sun);
                display: inline-block;
                padding: 0 16px;
                border-radius: 999px;
                box-shadow: 0 3px 0 rgba(43,35,80,.25)
            }

            #cards {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
                width: 100%
            }

            .card {
                width: clamp(84px,15%,150px);
                aspect-ratio: 1/1.05;
                background: #fff;
                border-radius: 22px;
                box-shadow: 0 6px 0 rgba(43,35,80,.3);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2px;
                padding: 6px;
                position: relative
            }

            .card:active {
                transform: translateY(4px);
                box-shadow: 0 2px 0 rgba(43,35,80,.3)
            }

            .card .em {
                font-size: clamp(34px,6vw,58px);
                line-height: 1
            }

            .card .nm {
                font-size: clamp(13px,2.4vw,18px);
                font-weight: 800
            }

            .card .st {
                position: absolute;
                top: -8px;
                right: -4px;
                font-size: 22px
            }

            .credit {
                font-size: 13px;
                font-weight: 800;
                color: var(--ink);
                background: rgba(255,255,255,.85);
                padding: 2px 12px;
                border-radius: 999px
            }

            #dock {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                gap: 10px 16px;
                min-height: 98px;
                background: #fff;
                border-radius: 24px;
                padding: 8px 12px;
                box-shadow: 0 5px 0 rgba(43,35,80,.25)
            }

            body.inmenu #dock {
                display: none
            }

            #cueBox {
                display: flex;
                align-items: center;
                gap: 10px
            }

            #speakBtn {
                width: 62px;
                height: 62px;
                border-radius: 50%;
                background: var(--teal);
                color: #fff;
                font-size: 30px;
                box-shadow: 0 4px 0 #0d7f75
            }

            #speakBtn:active {
                transform: translateY(3px);
                box-shadow: 0 1px 0 #0d7f75
            }

            #cueWrap {
                display: flex;
                flex-direction: column;
                align-items: center;
                min-width: 90px
            }

            #cue {
                font-size: 46px;
                line-height: 1.05;
                min-height: 52px;
                display: flex;
                align-items: center
            }

            #cue .big {
                font-size: 44px
            }

            #cue .sw {
                width: 46px;
                height: 46px;
                border-radius: 50%;
                border: 5px solid var(--ink);
                display: inline-block
            }

            #cueLabel {
                font-size: 18px;
                font-weight: 800
            }

            #dockBtns {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center
            }

            .act,.num,.bigb {
                background: var(--sun);
                border-radius: 22px;
                box-shadow: 0 5px 0 #c99a00;
                min-width: 76px;
                min-height: 70px;
                font-size: 36px;
                padding: 2px 14px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                line-height: 1.05
            }

            .act small {
                font-size: 16px;
                font-weight: 800
            }

            .num {
                background: var(--coral);
                color: #fff;
                box-shadow: 0 5px 0 #c23b3b;
                font-size: 38px;
                font-weight: 800;
                min-width: 64px
            }

            .num span {
                font-size: 11px;
                letter-spacing: 1px;
                max-width: 60px
            }

            .bigb {
                background: var(--grape);
                color: #fff;
                box-shadow: 0 5px 0 #5f35a8;
                min-width: 150px;
                min-height: 76px;
                font-size: 44px
            }

            .bigb small {
                font-size: 16px
            }

            .act:active,.num:active,.bigb:active {
                transform: translateY(4px);
                box-shadow: 0 1px 0 rgba(0,0,0,.3)
            }

            #dots {
                display: flex;
                gap: 8px;
                width: 100%;
                justify-content: center
            }

            #dots i {
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: #dfe3f1;
                border: 3px solid var(--ink);
                display: block
            }

            #dots i.on {
                background: var(--sun)
            }

            #foot {
                text-align: center;
                font-size: 13px;
                font-weight: 800;
                color: var(--ink);
                opacity: .85;
                flex: 0 0 auto
            }

            #done {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(43,35,80,.35)
            }

            #done .box {
                background: #fff;
                border-radius: 30px;
                padding: 18px 26px 22px;
                text-align: center;
                box-shadow: 0 8px 0 rgba(43,35,80,.35);
                max-width: 92%
            }

            #doneStars {
                font-size: clamp(40px,9vw,70px);
                letter-spacing: 6px
            }

            #done .great {
                font-size: clamp(30px,6vw,48px);
                font-weight: 800;
                color: var(--grape)
            }

            #done .row {
                display: flex;
                gap: 16px;
                justify-content: center;
                margin-top: 10px
            }

            #done .row button {
                width: 84px;
                height: 84px;
                border-radius: 50%;
                font-size: 42px;
                color: #fff;
                background: var(--teal);
                box-shadow: 0 5px 0 #0d7f75
            }

            #done .row #next {
                background: var(--coral);
                box-shadow: 0 5px 0 #c23b3b
            }

            @media (max-width: 480px) {
                .ib,.lv {
                    width:38px;
                    height: 38px;
                    font-size: 18px
                }

                #stars {
                    height: 38px;
                    font-size: 18px;
                    padding: 0 10px
                }

                .lv b {
                    width: 16px;
                    height: 16px;
                    font-size: 11px;
                    line-height: 16px
                }
            }

            @media (prefers-reduced-motion:reduce) {
                * {
                    scroll-behavior: auto
                }
            }
        </style>
        <div id="app">
            <header id="bar">
                <button id="homeBtn" class="pill ib" aria-label="Меню">🏠</button>
                <nav id="levels" aria-label="Уровни"></nav>
                <div id="stars" class="pill" aria-label="Звёзды">
                    ⭐ <span id="starCount">0</span>
                </div>
                <div style="display:flex;gap:6px">
                    <button id="sfxBtn" class="pill ib" aria-label="Звук и голос вкл/выкл">🔊</button>
                    <button id="musBtn" class="pill ib" aria-label="Музыка вкл/выкл">🎵</button>
                </div>
            </header>
            <main id="stage">
                <svg id="scene" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMax meet" aria-hidden="true">

                        <circle cx="880" cy="95" r="44" fill="#ffd23f"/>

            <div id="foot">Created by Filatova Elena</div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script>
            ( () => {
                const $ = s => document.querySelector(s)
                  , $$ = s => [...document.querySelectorAll(s)];
                const NS = 'http://www.w3.org/2000/svg';
                const store = {
                    get(k, d) {
                        try {
                            const v = localStorage.getItem('mm_' + k);
                            return v === null ? d : JSON.parse(v)

                        }

                        } catch (e) {}

                let level = 0

                  , rideTw = null;

                const sleep = ms => new Promise(r => setTimeout(r, ms));

                const shuffle = a => {

                    for (let i = a.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [a[i],a[j]] = [a[j], a[i]]
                    }
                    return a
                }

                function isCircle(pts) {
                    if (pts.length < 12)
                        return false;
                    let cx = 0
                      , cy = 0;
                    pts.forEach(p => {
                        cx += p.x;
                        cy += p.y
                    }
                    );
                    cx /= pts.length;
                    cy /= pts.length;
                    const rs = pts.map(p => Math.hypot(p.x - cx, p.y - cy))
                      , avg = rs.reduce( (a, b) => a + b, 0) / rs.length;
                    if (avg < 34)
                        return false;
                    const sd = Math.sqrt(rs.reduce( (a, r) => a + (r - avg) ** 2, 0) / rs.length);
                    if (sd / avg > .38)
                        return false;
                    const f = pts[0]
                      , l = pts[pts.length - 1];
                    if (Math.hypot(f.x - l.x, f.y - l.y) > avg * 1.15)
                        return false;
                    let sw = 0;
                    for (let i = 1; i < pts.length; i++) {
                        let d = Math.atan2(pts[i].y - cy, pts[i].x - cx) - Math.atan2(pts[i - 1].y - cy, pts[i - 1].x - cx);
                        while (d > Math.PI)
                            d -= 2 * Math.PI;
                        while (d < -Math.PI)
                            d += 2 * Math.PI;
                        sw += d;
                    }
                    return Math.abs(sw) > 5.0;
                }
                function waitCircle() {
                    return new Promise(res => {
                        const cv = $('#draw')
                          , c = cv.getContext('2d');
                        cv.classList.add('on');
                        let pts = []
                          , down = false;
                        const pos = e => {
                            const r = cv.getBoundingClientRect();
                            return {
                                x: e.clientX - r.left,
                                y: e.clientY - r.top
                            }
                        }
                        ;
                        const st = () => {
                            c.lineWidth = 12;
                            c.lineCap = 'round';
                            c.lineJoin = 'round';
                            c.strokeStyle = '#ff6b6b'
                        }
                        ;
                        const dn = e => {
                            down = true;
                            pts = [pos(e)];
                            c.clearRect(0, 0, W, H);
                            st();
                            c.beginPath();
                            c.moveTo(pts[0].x, pts[0].y);
                            try {
                                cv.setPointerCapture(e.pointerId)
                            } catch (_) {}
                        }
                        ;
                        const mv = e => {
                            if (!down)
                                return;
                            const p = pos(e);
                            pts.push(p);
                            c.lineTo(p.x, p.y);
                            c.stroke();
                            c.beginPath();
                            c.moveTo(p.x, p.y)
                        }
                        ;
                        const up = () => {
                            if (!down)
                                return;
                            down = false;
                            if (isCircle(pts)) {
                                cleanup();
                                cv.classList.remove('on');
                                res();
                            } else {
                                sfx.bad();
                                speak('Try again! Make a circle.');
                                gsap.fromTo(cv, {
                                    opacity: 1
                                }, {
                                    opacity: 0,
                                    duration: .5,
                                    onComplete: () => {
                                        c.clearRect(0, 0, W, H);
                                        gsap.set(cv, {
                                            opacity: 1
                                        })
                                    }
                                });
                            }
                        }
                        ;
                        const cleanup = () => {
                            cv.removeEventListener('pointerdown', dn);
                            cv.removeEventListener('pointermove', mv);
                            cv.removeEventListener('pointerup', up);
                            cv.removeEventListener('pointercancel', up)
                        }
                        ;
                        cv.addEventListener('pointerdown', dn);
                        cv.addEventListener('pointermove', mv);
                        cv.addEventListener('pointerup', up);
                        cv.addEventListener('pointercancel', up);
                    }
                    );
                }
                function ghostOn() {
                    const r = $('#stage').getBoundingClientRect();
                    gsap.set('#ghost', {
                        opacity: .9
                    });
                    const o = {
                        a: -Math.PI / 2
                    };
                    gsap.to(o, {
                        a: Math.PI * 1.5,
                        duration: 2.4,
                        ease: 'none',
                        repeat: -1,
                        onUpdate: () => {
                            gsap.set('#ghostDot', {
                                attr: {
                                    cx: 500 + Math.cos(o.a) * 120,
                                    cy: 330 + Math.sin(o.a) * 120
                                }
                            });
                        }
                    });
                }
                function ride(dur=4) {
                    const home = [[max.x, max.y, max.s], [mia.x, mia.y, mia.s]];
                    return new Promise(res => {
                        const o = {
                            a: 0
                        };
                        sfx.whoosh();
                        gsap.to('#mtop', {
                            rotation: '+=' + (dur * 180),
                            duration: dur,
                            ease: 'sine.inOut'
                        });
                        cheer(max);
                        cheer(mia);
                        rideTw = gsap.to(o, {
                            a: Math.PI * dur,
                            duration: dur,
                            ease: 'sine.inOut',
                            onUpdate: () => {
                                [max, mia].forEach( (c, i) => {
                                    const a = o.a + i * Math.PI
                                      , x = 520 + Math.cos(a) * 170
                                      , y = 505 + Math.sin(a) * 40;
                                    c.x = x;
                                    c.y = y;
                                    gsap.set(c.g, {
                                        x,
                                        y,
                                        scaleX: .85,
                                        scaleY: .85
                                    });
                                }
                                );
                            }
                            ,
                            onComplete: () => {
                                place(max, ...home[0]);
                                place(mia, ...home[1]);
                                res();
                            }
                        });
                    }
                    );
                }
                LV[5] = async (w) => {
                    place(max, 330, 548, 1);
                    place(mia, 720, 552, 1);
                    setDots(3);
                    for (let r = 0; r < 2; r++) {
                        setCue('<span class="big">⭕</span>', 'Make a circle!');
                        setPrompt('Make a circle! Draw with your finger.');
                        ghostOn();
                        await w(speak('Make a circle! Draw with your finger.'));
                        await w(waitCircle());
                        gsap.killTweensOf('#ghost,#ghostDot');
                        gsap.to('#ghost', {
                            opacity: 0,
                            duration: .3
                        });
                        const cv = $('#draw');
                        gsap.to(cv, {
                            opacity: 0,
                            duration: 1.2,
                            delay: .4
                        });
                        sfx.good();
                        burst(W / 2, H * .5, 60);
                        speak('Circle! Round and round!');
                        bubble(max.head, 'Circle!');
                        await w(ride());
                        dot(r);
                        gsap.set(cv, {
                            opacity: 1
                        });
                        cv.getContext('2d').clearRect(0, 0, W, H);
                        await w(sleep(300));
                    }
                    setCue('<span class="big">👏</span>', 'Clap! Clap!');
                    setPrompt('Clap, clap, clap! Count to five.');
                    dockSet('<button id="clapBtn" class="bigb">👏<small>clap</small></button>');
                    await w(speak('Clap, clap, clap! Count to five.'));
                    let n = 0;
                    await w(new Promise(res => {
                        $('#clapBtn').addEventListener('pointerdown', () => {
                            if (n >= 5)
                                return;
                            n++;
                            sfx.clap();
                            clapAnim(max);
                            clapAnim(mia);
                            showBig(n);
                            speak(NUMS[n] + '!');
                            if (n === 5)
                                setTimeout(res, 900);
                        }
                        );
                    }
                    ));
                    dot(2);
                    dockSet('');
                    await w(finish(w));
                }
                ;

                LV[6] = async (w, alive) => {
                    place(max, 60, 575, .65);
                    place(mia, 940, 575, .65);
                    gsap.set('#slide', {
                        autoAlpha: 1
                    });
                    const tyre = mkItem('tyre')
                      , mouse = mkItem('mouse')
                      , bird = mkItem('bird');
                    gsap.set(tyre, {
                        x: 230,
                        y: 555
                    });
                    gsap.set(mouse, {
                        x: 370,
                        y: 560
                    });
                    gsap.set(bird, {
                        x: 680,
                        y: 560
                    });
                    const wing = bird.querySelector('.wing');
                    gsap.set(wing, {
                        transformOrigin: '50% 100%'
                    });
                    [tyre, mouse, bird].forEach( (g, i) => {
                        gsap.from(g, {
                            y: 300,
                            opacity: 0,
                            duration: .6,
                            delay: i * .1,
                            ease: 'bounce.out'
                        });
                        gsap.to(g.art, {
                            y: -4,
                            duration: .8 + i * .15,
                            yoyo: true,
                            repeat: -1,
                            ease: 'sine.inOut'
                        });
                    }
                    );
                    const slideEl = $('#slide')
                      , merryEl = $('#merry');
                    [slideEl, merryEl].forEach(e => e.style.cursor = 'pointer');
                    const slideAnim = () => new Promise(r => {
                        const c = mia;
                        sfx.whoosh();
                        gsap.set(c.g, {
                            x: 868,
                            y: 292
                        });
                        c.x = 868;
                        c.y = 292;
                        cheer(c);
                        gsap.to(c.g, {
                            x: 745,
                            y: 476,
                            rotation: -35,
                            duration: 1,
                            ease: 'power1.in',
                            delay: .3,
                            onComplete: () => {
                                gsap.to(c.g, {
                                    rotation: 0,
                                    duration: .2
                                });
                                gsap.to(c.g, {
                                    x: 940,
                                    y: 575,
                                    duration: .8,
                                    ease: 'power1.inOut',
                                    onComplete: () => {
                                        c.x = 940;
                                        c.y = 575;
                                        r()
                                    }
                                });
                            }
                        });
                    }
                    );
                    const W = [{
                        k: 'slide',
                        el: slideEl,
                        react: slideAnim
                    }, {
                        k: 'merry-go-round',
                        el: merryEl,
                        react: () => ride(2.6)
                    }, {
                        k: 'tyre',
                        el: tyre,
                        react: () => new Promise(r => {
                            sfx.pop();
                            gsap.timeline({
                                onComplete: r
                            }).to(tyre, {
                                y: 470,
                                duration: .3,
                                ease: 'power2.out'
                            }).to(tyre, {
                                y: 555,
                                duration: .3,
                                ease: 'bounce.out'
                            }).to(tyre, {
                                y: 515,
                                duration: .2
                            }).to(tyre, {
                                y: 555,
                                duration: .25,
                                ease: 'bounce.out'
                            });
                        }
                        )
                    }, {
                        k: 'mouse',
                        el: mouse,
                        react: () => new Promise(r => {
                            tone(1300, .07, 'square', .05);
                            tone(1600, .07, 'square', .05, .1);
                            gsap.timeline({
                                onComplete: r
                            }).to(mouse, {
                                x: 480,
                                duration: .45
                            }).set(mouse, {
                                scaleX: -1
                            }).to(mouse, {
                                x: 370,
                                duration: .45
                            }).set(mouse, {
                                scaleX: 1
                            });
                        }
                        )
                    }, {
                        k: 'bird',
                        el: bird,
                        react: () => new Promise(r => {
                            [1500, 1900, 1700, 2100].forEach( (f, i) => tone(f, .09, 'sine', .06, i * .14));
                            gsap.to(wing, {
                                rotation: -40,
                                duration: .1,
                                yoyo: true,
                                repeat: 11
                            });
                            gsap.timeline({
                                onComplete: () => {
                                    gsap.set(wing, {
                                        rotation: 0
                                    });
                                    r()
                                }
                            }).to(bird, {
                                y: 410,
                                x: '+=60',
                                duration: .8,
                                ease: 'power1.out'
                            }).to(bird, {
                                y: 560,
                                x: '-=60',
                                duration: .9,
                                ease: 'power1.in'
                            });
                        }
                        )
                    }];
                    setDots(11);
                    let dotsN = 0;
                    let mode = 'intro'
                      , target = null
                      , resolveFind = null
                      , busy = false
                      , introDone = null;
                    const seen = new Set();
                    W.forEach(o => o.el.addEventListener('pointerdown', async () => {
                        if (!alive() || busy)
                            return;
                        if (mode === 'intro') {
                            busy = true;
                            sfx.pop();
                            bubble(o.el, o.k);
                            const sp = speak(cap(o.k) + '!');
                            const first = !seen.has(o.k);
                            seen.add(o.k);
                            await o.react();
                            await sp;
                            if (!alive())
                                return;
                            if (first)
                                dot(dotsN++);
                            busy = false;
                            if (seen.size === W.length && introDone) {
                                const f = introDone;
                                introDone = null;
                                f();
                            }
                        } else if (mode === 'find') {
                            if (!target)
                                return;
                            if (o.k === target) {
                                busy = true;
                                const f = resolveFind;
                                target = null;
                                sfx.good();
                                bubble(o.el, cap(o.k) + '!');
                                const sp = speak('Yes! ' + cap(o.k) + '!');
                                await o.react();
                                await sp;
                                if (!alive())
                                    return;
                                busy = false;
                                f && f(o);
                            } else {
                                sfx.bad();
                                bubble(o.el, cap(o.k));
                                speak(cap(o.k) + '. Try again!');
                            }
                        }
                    }
                    ));
                    setCue('<span class="big">👆</span>', 'Touch and listen!');
                    setPrompt('Touch the slide, the merry-go-round, the tyre, the mouse and the bird.');
                    await w(speak('Look! Touch and listen.'));
                    await w(new Promise(r => {
                        if (seen.size === W.length)
                            r();
                        else
                            introDone = r;
                    }
                    ));
                    await w(speak('Slide, merry-go-round, tyre, mouse, bird!'));
                    mode = 'find';
                    for (const o of shuffle(W).slice(0, 3)) {
                        setCue('<span class="big">👂</span>', o.k);
                        setPrompt(`Show me the ${o.k}!`);
                        target = o.k;
                        await w(speak(`Show me the ${o.k}!`));
                        await w(new Promise(r => {
                            if (target === null && !busy)
                                r();
                            else
                                resolveFind = r;
                        }
                        ));
                        burstEl(o.el, 40);
                        jump(max);
                        dot(dotsN++);
                        await w(sleep(300));
                    }
                    mode = 'shapes';
                    gsap.to(['#merry', '#slide', tyre, mouse, bird], {
                        autoAlpha: 0,
                        duration: .4
                    });
                    await w(sleep(500));
                    $('#items').innerHTML = '';
                    const S = ['circle', 'triangle', 'square']
                      , slots = [280, 500, 720];
                    const sh = S.map( (k, i) => {
                        const g = mkItem(k);
                        gsap.set(g, {
                            x: slots[i],
                            y: 520,
                            scaleX: 1.25,
                            scaleY: 1.25
                        });
                        gsap.from(g, {
                            y: 240,
                            opacity: 0,
                            duration: .6,
                            delay: i * .12,
                            ease: 'bounce.out'
                        });
                        return g;
                    }
                    );
                    let sMode = 'intro'
                      , sTarget = null
                      , sRes = null
                      , sIntro = null;
                    const sSeen = new Set();
                    sh.forEach( (g, i) => g.addEventListener('pointerdown', () => {
                        if (!alive())
                            return;
                        const k = S[i];
                        sfx.pop();
                        gsap.fromTo(g.art, {
                            rotation: -20
                        }, {
                            rotation: 0,
                            duration: .7,
                            ease: 'elastic.out(2,.3)'
                        });
                        if (sMode === 'intro') {
                            bubble(g, cap(k));
                            speak(cap(k) + '!');
                            sSeen.add(k);
                            if (sSeen.size === 3 && sIntro) {
                                const f = sIntro;
                                sIntro = null;
                                setTimeout(f, 900);
                            }
                        } else if (sTarget) {
                            if (k === sTarget) {
                                const f = sRes;
                                sTarget = null;
                                sfx.good();
                                bubble(g, cap(k) + '!');
                                burstEl(g, 40);
                                f && f();
                            } else {
                                sfx.bad();
                                bubble(g, cap(k));
                                speak(cap(k) + '. Try again!');
                            }
                        }
                    }
                    ));
                    setCue('<span class="big">🔺</span>', 'Shapes!');
                    setPrompt('Circle, triangle, square! Touch the shapes.');
                    await w(speak('Now shapes! Touch the shapes.'));
                    await w(new Promise(r => {
                        if (sSeen.size === 3)
                            r();
                        else
                            sIntro = r;
                    }
                    ));
                    sMode = 'find';
                    for (const k of shuffle(S)) {
                        setCue('<span class="big">👂</span>', k);
                        setPrompt(`Show me the ${k}!`);
                        sTarget = k;
                        await w(speak(`Show me the ${k}!`));
                        await w(new Promise(r => {
                            if (sTarget === null)
                                r();
                            else
                                sRes = r;
                        }
                        ));
                        jump(max);
                        jump(mia);
                        dot(dotsN++);
                        await w(speak(`Yes! A ${k}!`));
                        shuffle(sh).forEach( (g, j) => gsap.to(g, {
                            x: slots[j],
                            duration: .6,
                            ease: 'power2.inOut'
                        }));
                        sfx.whoosh();
                        await w(sleep(700));
                    }
                    await w(finish(w));
                }
                ;

                /* ---------- init ---------- */
                function init() {
                    $('#levels').innerHTML = [1, 2, 3, 4, 5, 6].map(n => `<button class="pill lv" data-l="${n}" aria-label="Уровень ${n}">${META[n].em}<b>${n}</b></button>`).join('');
                    $$('.lv').forEach(b => b.onclick = () => startLevel(+b.dataset.l));
                    $('#homeBtn').onclick = showMenu;
                    $('#starCount').textContent = stars;
                    const sb = $('#sfxBtn')
                      , mb = $('#musBtn');
                    const paint = () => {
                        sb.classList.toggle('off', !sfxOn);
                        mb.classList.toggle('off', !musOn);
                        sb.textContent = sfxOn ? '🔊' : '🔇';
                        sb.setAttribute('aria-pressed', String(sfxOn));
                        mb.setAttribute('aria-pressed', String(musOn));
                    }
                    ;
                    sb.onclick = () => {
                        sfxOn = !sfxOn;
                        store.set('sfx', sfxOn);
                        if (!sfxOn) {
                            try {
                                speechSynthesis.cancel()
                            } catch (e) {}
                        } else {
                            ctx();
                            sfx.pop();
                        }
                        paint();
                    }
                    ;
                    mb.onclick = () => {
                        musOn = !musOn;
                        store.set('mus', musOn);
                        ctx();
                        musicOn();
                        paint();
                    }
                    ;
                    $('#speakBtn').onclick = () => {
                        ctx();
                        curPrompt();
                    }
                    ;
                    $('#again').onclick = () => startLevel(level);
                    $('#next').onclick = () => startLevel(Math.min(6, level + 1));
                    paint();
                    initScene();
                    max = makeChar('max');
                    mia = makeChar('mia');
                    max.hit.addEventListener('pointerdown', () => {
                        if (level === 0) {
                            ctx();
                            started = true;
                            wave(max);
                            say(max, 'Hello! My name is Billy!');
                        }
                    }
                    );
                    mia.hit.addEventListener('pointerdown', () => {
                        if (level === 0) {
                            ctx();
                            started = true;
                            wave(mia);
                            say(mia, 'Hello! My name is Lilly!');
                        }
                    }
                    );
                    document.addEventListener('pointerdown', () => {
                        started = true;
                        if (musOn && !musTimer) {
                            ctx();
                            musicOn()
                        }
                    }
                    , {
                        once: true
                    });
                    sizeCanvases();
                    document.body.classList.add('inmenu');
                    showMenu();
                }
                if (window.gsap)
                    init();
                else
                    document.addEventListener('DOMContentLoaded', () => setTimeout( () => window.gsap && init(), 300));
            }
            )();
        </script>
    </body>
</html>
